services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: oleh-ai-assistant:latest
    container_name: oleh-ai-assistant
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
